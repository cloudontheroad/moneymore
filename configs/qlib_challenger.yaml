account_id: qlib_gru_shadow
model_id: qlib_gru_alpha360_v1
protocol_version: challenger_v2
feature_set: moneymore_alpha360_12x60
sequence_length: 60
label_horizon: 5
portfolio_policy:
  method: global_rank_weighted_topk
  top_k: 10
  exit_rank: 15
  max_replacements: 3
  minimum_weight: 0.05
  maximum_weight: 0.15
  correlation_lookback: 120
  correlation_penalty: 0.00
  cluster_correlation_threshold: 0.65
  maximum_cluster_members: 3
  weighting_method: confidence_softmax
  confidence_temperature: 1.25
  confidence_shrinkage: 0.45
rebalance_interval: 5
exposure_policy:
  method: fully_invested
  target_exposure: 1.00
research_gate:
  minimum_samples: 10000
  minimum_rank_ic: 0.01
  minimum_rank_ic_ir: 0.08
  minimum_cost_adjusted_excess_return: 0.0
  minimum_seed_count: 5
  minimum_positive_seed_ratio: 0.80
  require_positive_lightgbm_rank_ic: true
  minimum_universe_size: 800
promotion_gate:
  minimum_rank_ic: 0.02
  minimum_rank_ic_ir: 0.10
  minimum_forward_days: 20
  minimum_forward_rank_ic: 0.0
train:
  start: "2015-01-01"
  end: "2023-12-31"
valid:
  start: "2024-01-01"
  end: "2024-12-31"
test:
  start: "2025-01-01"
  end: "2026-07-26"
forward:
  start: "2026-07-27"
  end: "2099-12-31"
model:
  d_feat: 12
  hidden_size: 64
  num_layers: 2
  dropout: 0.1
  n_epochs: 100
  early_stop: 10
  batch_size: 1024
  learning_rate: 0.001
  seeds: [17, 23, 42, 71, 101]
ensemble:
  method: daily_rank_blend
  lightgbm_weight: 0.50
  gru_weight: 0.50
training_policy:
  frequency: weekly
  automatic_promotion: false
  candidate_only: true
candidate_observation_policy:
  enabled: true
  version: candidate_lifecycle_v1
  effective_date: '20261026'
  checkpoints: [20, 40, 60]
  review_expiry_trading_days: 10
  preliminary_review_days: 20
  formal_review_days: 60
  new_candidate_resets_existing: false
execution_policy:
  experimental_paper_enabled: true
  research_gate_blocks_promotion_only: false
  failed_gate_mode: scores_only
  minimum_rebalance_notional: 5000
drift_monitoring:
  reference_window: 20
  recent_window: 20
  minimum_observations: 20
  minimum_rolling_rank_ic: -0.02
  maximum_score_psi: 0.25
  maximum_feature_psi: 0.25
  enforce_feature_psi: false
  maximum_turnover: 0.50
  maximum_cost_ratio: 0.005
