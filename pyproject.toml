[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moneymore"
version = "0.1.0"
description = "Auditable personal A-share quantitative trading system"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "pyarrow>=16,<22",
  "python-dotenv>=1,<2",
  "tushare>=1.4,<2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
alphafeed = ["alphafeed==0.1.4"]
desktop = ["pywinauto>=0.6.8,<0.7; sys_platform == 'win32'", "psutil>=6,<8"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
ai = [
  "pyqlib>=0.9.7,<1",
  "torch>=2.7",
  "lightgbm>=4.6,<5",
  "scikit-learn>=1.7,<2",
]
risk = [
  "skfolio>=0.15,<1",
  "gymnasium>=1.0,<2",
  "stable-baselines3>=2.6,<3",
  "torch>=2.7",
]

[project.scripts]
moneymore = "moneymore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moneymore"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
